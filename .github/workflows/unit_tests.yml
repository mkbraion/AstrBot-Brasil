name: Testes unitários

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # O conjunto original ainda possui falhas específicas do Windows;
    # por isso essa execução permanece informativa até elas serem corrigidas.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Instalar dependência do sandbox no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Habilitar e verificar sandbox no Linux
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Verificar sandbox no macOS
        if: runner.os == 'macOS'
        run: test -x /usr/bin/sandbox-exec

      - name: Executar testes
        run: |
          chmod +x scripts/run_pytests_ci.sh
          bash ./scripts/run_pytests_ci.sh ./tests
