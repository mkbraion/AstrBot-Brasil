name: Dashboard pt-BR - CI

on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard_ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Verificar i18n e build do Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Verificar chaves de internacionalização
        working-directory: dashboard
        run: pnpm run i18n:check

      - name: Verificar TypeScript e gerar build
        working-directory: dashboard
        run: pnpm run build

      - name: Registrar SHA do commit no artefato
        run: |
          mkdir -p dashboard/dist/assets
          git rev-parse HEAD > dashboard/dist/assets/version

      - name: Salvar build do dashboard
        uses: actions/upload-artifact@v7
        with:
          name: astrbot-brasil-dashboard
          path: dashboard/dist
