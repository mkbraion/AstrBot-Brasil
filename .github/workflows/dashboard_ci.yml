name: Dashboard pt-BR - CI

on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - 'astrbot/__init__.py'
      - 'astrbot/core/utils/t2i/template/shiki_runtime.iife.js'
      - 'build-dashboard.ps1'
      - 'Dockerfile'
      - '.github/workflows/dashboard_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - 'astrbot/__init__.py'
      - 'astrbot/core/utils/t2i/template/shiki_runtime.iife.js'
      - 'build-dashboard.ps1'
      - 'Dockerfile'
      - '.github/workflows/dashboard_ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Verificar i18n e build do Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Verificar chaves de internacionalização
        working-directory: dashboard
        run: pnpm run i18n:check

      - name: Verificar TypeScript e gerar build
        working-directory: dashboard
        run: pnpm run build

      - name: Verificar cobertura e marcadores do português
        working-directory: dashboard
        run: pnpm run i18n:check:ptbr

      - name: Registrar versão do núcleo no artefato
        run: |
          mkdir -p dashboard/dist/assets
          python -c "from pathlib import Path; from astrbot import __version__; Path('dashboard/dist/assets/version').write_text('v' + __version__, encoding='utf-8')"

      - name: Salvar build do dashboard
        uses: actions/upload-artifact@v7
        with:
          name: astrbot-brasil-dashboard
          path: dashboard/dist
