name: Teste de inicialização

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Instalar dependências
        run: uv pip install --system -r requirements.txt
        timeout-minutes: 15

      - name: Executar teste de inicialização
        run: python scripts/smoke_startup_check.py
        timeout-minutes: 2
