name: Verificação de código

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar uv
        run: pip install uv

      - name: Instalar dependências
        run: uv sync

      - name: Verificar formatação com Ruff
        run: uvx --from ruff==0.15.22 ruff format --check .

      - name: Verificar código com Ruff
        run: uvx --from ruff==0.15.22 ruff check .
