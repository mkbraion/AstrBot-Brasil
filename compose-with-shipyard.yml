version: '3.8'

# Para conectar o QQ NapCat, consulte: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    build: .
    image: astrbot-brasil:local
    container_name: astrbot
    restart: always
    ports: # Sobre as portas: https://github.com/AstrBotDevs/AstrBot/issues/497
      - "6185:6185" # Obrigatória: painel do AstrBot
      - "6199:6199" # Opcional: WebSocket da conta pessoal do QQ
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ${PWD}/data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - astrbot_network

  shipyard:
    image: soulter/shipyard-bay:latest
    container_name: astrbot_shipyard
    # ports:
    #   - "8156:8156"
    environment:
      - PORT=8156
      - DATABASE_URL=sqlite+aiosqlite:///./data/bay.db
      - ACCESS_TOKEN=secret-token
      - MAX_SHIP_NUM=10
      - BEHAVIOR_AFTER_MAX_SHIP=reject
      - DOCKER_IMAGE=soulter/shipyard-ship:latest
      - DOCKER_NETWORK=astrbot_network
      - SHIP_DATA_DIR=${PWD}/data/shipyard/ship_mnt_data
      - DEFAULT_SHIP_CPUS=1.0
      - DEFAULT_SHIP_MEMORY=512m
    volumes:
      - ${PWD}/data/shipyard/bay_data:/app/data
      - ${PWD}/data/temp:/AstrBot/data/temp           # Permite que o ambiente isolado acesse os arquivos enviados
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - astrbot_network

networks:
  astrbot_network:
    name: astrbot_network
    driver: bridge
