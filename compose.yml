version: '3.8'

# Para conectar o OneBot v11 NapCat, consulte: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    build: .
    image: astrbot-brasil:local
    container_name: astrbot
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "6185:6185" # Painel do AstrBot
      - "6199:6199" # Opcional: WebSocket do OneBot v11 NapCat
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
